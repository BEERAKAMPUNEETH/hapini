# ==============================================================================
# AWS App Runner Service Configuration for Hapini Backend
# ==============================================================================
version: 1.0
runtime: nodejs20
build:
  commands:
    pre-build:
      - cd backend
      - npm ci
    build:
      - npm run build
run:
  command: node dist/index.js
  network:
    port: 5000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "5000"
    - name: DB_SSL
      value: "true"
    - name: CACHE_TTL_SECONDS
      value: "300"
    - name: SEARCH_CACHE_TTL_SECONDS
      value: "120"
    - name: PRODUCT_CACHE_TTL_SECONDS
      value: "600"
